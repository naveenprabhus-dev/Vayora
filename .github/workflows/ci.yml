name: CI Quality & Security Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    name: Format, Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for exposed secret patterns
        run: |
          if grep -rnE "AIza[0-9A-Za-z_-]{30,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=coverage \
            --exclude="*.test.ts" --exclude="*.test.tsx" --exclude="firebase-applet-config.json" .; then
            echo "Potential hardcoded secret or private key detected!"
            exit 1
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Run typecheck, oxlint, and ESLint (including Firestore rules)
        run: npm run lint

      - name: Run unit tests (contracts, API, web + axe-core)
        run: npm run test:unit

      - name: Run API integration tests
        run: npm run test:integration

      - name: Build production web and API bundles
        run: npm run build

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E and WCAG 2.2 AA accessibility audit
        run: npm run test:e2e
        env:
          CI: 'true'
